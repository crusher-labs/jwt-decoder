<!DOCTYPE html>
<html lang="en"
      data-default-theme="minimal"
      data-theme-lock="minimal"
      data-default-mode="light"
      data-default-brand="#0ea5e9">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Decoder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/themes/minimal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.css">
    <script defer src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tool-mono { font-family: 'JetBrains Mono', monospace; }

        .tool-stack { display: grid; gap: var(--crusher-spacing-4); max-width: 42rem; margin-inline: auto; }
        .tool-section { padding: var(--crusher-spacing-6); display: grid; gap: var(--crusher-spacing-4); }
        .tool-label { display: block; margin-bottom: var(--crusher-spacing-1); font-size: var(--crusher-font-size-sm); color: var(--crusher-text-secondary); }
        .tool-action-row { display: flex; justify-content: center; }
        .tool-action { padding-inline: var(--crusher-spacing-6); padding-block: var(--crusher-spacing-2); border-radius: var(--crusher-radius-full); font-weight: 600; }
        textarea.crusher-tool-control { padding: var(--crusher-spacing-3); font-size: var(--crusher-font-size-xs); word-break: break-all; }
        .tool-output { display: grid; gap: var(--crusher-spacing-3); }
        .token-part {
            padding: var(--crusher-spacing-4);
            border-radius: var(--crusher-radius-lg);
            border: 1px solid var(--crusher-border-primary);
            background: var(--crusher-background-muted);
            color: var(--crusher-text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: var(--crusher-font-size-xs);
            overflow-x: auto;
            margin: 0;
            white-space: pre;
        }
        .token-part[data-kind="header"] {
            border-color: color-mix(in srgb, var(--crusher-color-brand-primary) 32%, var(--crusher-border-primary));
            background: color-mix(in srgb, var(--crusher-color-brand-primary) 8%, var(--crusher-background-muted));
        }
        .token-part[data-kind="payload"] {
            border-color: color-mix(in srgb, #8b5cf6 32%, var(--crusher-border-primary));
            background: color-mix(in srgb, #8b5cf6 8%, var(--crusher-background-muted));
        }
        .token-part-label {
            display: block;
            font-size: var(--crusher-font-size-sm);
            font-weight: 600;
            color: var(--crusher-text-secondary);
            margin-bottom: var(--crusher-spacing-2);
        }
    </style>
</head>
<body class="crusher-tool-page">

    <main class="crusher-tool-shell">
        <header class="crusher-tool-header">
            <h1 class="crusher-tool-title">JWT Decoder</h1>
            <p class="crusher-tool-lede">Decode JSON Web Tokens without verification.</p>
        </header>

        <div class="tool-stack">
            <section class="crusher-tool-surface tool-section">
                <div>
                    <label for="token" class="tool-label">JWT Token</label>
                    <textarea id="token" rows="4" class="crusher-tool-control tool-mono" placeholder="eyJhbGciOiJIb..."></textarea>
                </div>
                <div class="tool-action-row">
                    <button id="decode-btn" type="button" class="crusher-tool-action tool-action">Decode</button>
                </div>
                <div id="output" class="tool-output"></div>
            </section>
        </div>
    </main>

    <a href="https://tools.muhammadhassaanjaved.com/" id="hub-bubble" class="crusher-tool-fab" title="View All Tools" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
    </a>

    <crusher-style-switcher
      default-theme="minimal"
      default-brand="#0ea5e9"
      hide-themes
      hide-theme-color>
        <svg slot="mode-light-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg slot="mode-dark-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </crusher-style-switcher>
    <script type="module" src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.standalone.esm.js"></script>

    <script>
        function b64DecodeUnicode(str) {
            // Base64URL -> Base64 (handle - _ chars and missing padding)
            const normalized = str.replace(/-/g, '+').replace(/_/g, '/');
            const padded = normalized + '==='.slice((normalized.length + 3) % 4);
            return decodeURIComponent(atob(padded).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        }

        document.getElementById('decode-btn').addEventListener('click', () => {
            const out = document.getElementById('output');
            // Clear previous output safely
            while (out.firstChild) out.removeChild(out.firstChild);

            try {
                const tok = document.getElementById('token').value.trim().split('.');
                if (tok.length !== 3) throw new Error('Invalid JWT');

                const parts = [
                    { name: 'Header', kind: 'header' },
                    { name: 'Payload', kind: 'payload' }
                ];

                parts.forEach((part, i) => {
                    const json = JSON.parse(b64DecodeUnicode(tok[i]));

                    const wrap = document.createElement('div');

                    const label = document.createElement('span');
                    label.className = 'token-part-label';
                    label.textContent = part.name;

                    const pre = document.createElement('pre');
                    pre.className = 'token-part';
                    pre.dataset.kind = part.kind;
                    pre.textContent = JSON.stringify(json, null, 2);

                    wrap.appendChild(label);
                    wrap.appendChild(pre);
                    out.appendChild(wrap);
                });
            } catch (e) {
                const err = document.createElement('p');
                err.className = 'tool-label';
                err.textContent = 'Invalid Token';
                out.appendChild(err);
            }
        });
    </script>
</body>
</html>
